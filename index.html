<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#466252"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Understory"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet"><title>Understory — Understand what happened</title><style>
*{box-sizing:border-box}body{margin:0;background:#a9a08e;color:#293a31;font-family:Handlee,cursive}.phone{width:min(430px,100vw);height:min(760px,100vh);min-height:650px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#f8f2e9b8,#f8f2e9b8),url('assets/background.png') center/cover;box-shadow:0 15px 45px #49423866}.top{position:absolute;top:23px;left:27px;right:27px;display:flex;justify-content:space-between;align-items:center}.route{font:700 9px system-ui;text-transform:uppercase;letter-spacing:.16em;color:#53665b}.topActions{display:flex;align-items:center;gap:8px}.settingsButton,.close{border:0;background:none;color:#354b40;font:20px Handlee;cursor:pointer;padding:3px}.close{font-size:25px}.settingBlock{border-top:1px solid #63776b88;padding:13px 2px;margin-top:8px}.settingBlock h2{font-size:18px;margin:0 0 5px;color:#315143}.settingBlock p{font-size:12px;line-height:1.45;color:#5b6b62;margin:4px 0 10px}.statusLine{font:700 10px system-ui;text-transform:uppercase;letter-spacing:.1em;color:#617168;margin:7px 0}.toggleButton{width:100%;border:1px solid #60756899;background:#eef1eabb;padding:10px 11px;text-align:left;color:#30483c;font:15px Handlee;cursor:pointer}.toggleButton.on{background:#496454;color:#fff8ed}.progress{position:absolute;top:61px;left:31px;right:31px;height:3px;display:flex;gap:5px}.dot{height:2px;flex:1;background:#82918855}.dot.on{background:#466252}.stage{position:absolute;top:92px;left:52px;right:52px;bottom:80px;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:4px;scrollbar-width:none}.stage::-webkit-scrollbar{display:none}.step{font:700 9px system-ui;text-transform:uppercase;letter-spacing:.17em;color:#617168;margin-bottom:10px}.stage h1{font-size:27px;line-height:1.14;margin:0 0 10px;color:#29473a}.explain{font-size:14px;line-height:1.4;color:#52645b;margin:0 0 18px}.field{width:100%;min-height:120px;border:0;border-bottom:1px solid #536b5e;background:#f3eee4b8;padding:13px 12px;color:#293a31;font:16px/1.35 Handlee,cursive;resize:none;outline:none;box-shadow:0 4px 12px #554c4020}.field:focus{background:#f8f3e9dd;border-color:#294c3b}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 8px}.chip{border:1px solid #60756788;background:#edf0e9b8;padding:7px 10px;color:#344b40;font:13px Handlee;cursor:pointer;border-radius:0;transform:rotate(-.4deg)}.chip:nth-child(even){transform:rotate(.5deg)}.chip.selected{background:#496454;color:#f7f1e7;border-color:#496454}.triplet{display:grid;gap:12px}.mini label{display:block;font:700 9px system-ui;text-transform:uppercase;letter-spacing:.14em;color:#5b6c62;margin-bottom:4px}.mini textarea{min-height:59px}.actions{margin-top:auto}.primary{width:100%;border:0;border-bottom:1px solid #496254;background:#e3e9e1c9;padding:11px 13px;color:#29473a;text-align:left;font:17px Handlee;cursor:pointer;position:relative}.primary:after{content:'→';position:absolute;right:12px}.secondary{display:flex;justify-content:space-between;margin-top:13px}.secondary button{border:0;background:none;color:#53675d;padding:3px;font:13px Handlee;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.summary{overflow:auto;padding-bottom:12px}.summary h1{margin-bottom:14px}.row{border-bottom:1px solid #64776b70;padding:8px 2px}.row b{display:block;font:700 9px system-ui;text-transform:uppercase;letter-spacing:.13em;color:#66756d;margin-bottom:3px}.row span{font-size:14px;line-height:1.3}.row button{float:right;border:0;background:none;color:#52685d;font:11px Handlee;text-decoration:underline;cursor:pointer}.choiceList{display:grid;gap:8px;margin-top:6px}.choice{border:0;border-bottom:1px solid #61766a88;background:#eff1ebb8;text-align:left;padding:9px 11px;color:#30483c;font:14px Handlee;cursor:pointer}.choice.selected{background:#496454;color:#f7f1e7}.binch{margin-top:13px;border:1px solid #60756899;background:#f4eee4c9;padding:9px 11px;font:14px Handlee;color:#30483c;cursor:pointer;width:100%}.notbuilt{display:block;font:9px system-ui;color:#6a756f;margin-top:4px}.modal{position:absolute;inset:0;background:#283d35aa;display:none;align-items:center;justify-content:center;padding:32px;z-index:4}.modal.open{display:flex}.paper{width:100%;background:#f5efe4;padding:20px;box-shadow:4px 8px 24px #1f2e28aa}.paper h2{margin:0 0 7px;font-size:23px}.paper p{font-size:12px;color:#54645b}.paper textarea{width:100%;height:180px;border:1px solid #71827866;background:#fffaf2;padding:10px;font:13px/1.35 Handlee;color:#293a31}.paper .buttons{display:flex;gap:8px;margin-top:10px}.paper button{flex:1;border:0;background:#496454;color:#fff8ed;padding:9px;font:13px Handlee;cursor:pointer}.paper button.alt{background:#dce4dc;color:#30483c}.groupLabel{font:700 9px system-ui;text-transform:uppercase;letter-spacing:.14em;color:#617168;margin:12px 0 0}.holdCard{border-top:1px solid #63776b88;border-bottom:1px solid #63776b88;padding:12px 2px;margin:8px 0}.holdCard b{display:block;font:700 9px system-ui;text-transform:uppercase;letter-spacing:.13em;color:#64756c;margin-bottom:4px}.holdCard span{display:block;font-size:15px;line-height:1.35}.quietNote{font-size:12px;line-height:1.4;color:#5b6b62;margin:10px 0}.timerReadout{font-size:34px;color:#315143;margin:13px 0 4px}.toast{position:absolute;bottom:22px;left:65px;right:65px;background:#355144;color:#fff8ed;text-align:center;padding:9px;font:12px system-ui;display:none;z-index:6}.toast.show{display:block}
</style></head><body><main class="phone"><header class="top"><div class="route">Help me understand</div><div class="topActions"><button class="settingsButton" id="settingsButton" aria-label="Settings">⚙</button><button class="close" aria-label="Close">×</button></div></header><div class="progress" id="progress"></div><section class="stage" id="stage"></section><div class="modal" id="modal"><div class="paper"><h2>Context for Binch</h2><p>Review this first. Nothing is sent automatically.</p><textarea id="contextText"></textarea><div class="buttons"><button id="copyContext">Copy text</button><button class="alt" id="closeModal">Close</button></div><span class="notbuilt">Opening Telegram is not wired in this review prototype.</span></div></div><div class="toast" id="toast">Copied to clipboard</div></main><script>
const KEY='understory-understand-flow-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{"step":0,"answers":{}}');
state.pause=state.pause||{step:0,answers:{0:[],1:[],2:['Return when I choose']},duration:20,active:false,started:null};
state.settings=state.settings||{notifications:false,privateWording:true};
const steps=[
 {title:'What happened?',help:'Write only what someone could have seen or heard. You do not need to explain why yet.',type:'text',placeholder:'Write what happened here…'},
 {title:'What did your mind say it meant?',help:'Write the meaning, fear, or prediction that arrived. Calling it a meaning does not mean it is wrong.',type:'text',placeholder:'Write what it seemed to mean…'},
 {title:'What do you actually know?',help:'Separate what is confirmed from what is still unknown or being predicted.',type:'triplet',fields:[['known','Known','What is directly confirmed?'],['unknown','Unknown','What information do you not have?'],['predicted','Predicted','What is your mind expecting will happen?']]},
 {title:'What is happening inside you?',help:'Choose anything that fits. Feelings, body reactions, and urges can all be true at once.',type:'multiGrouped',groups:[['Feelings',['Panicked','Angry','Hurt','Sad','Afraid','Ashamed','Rejected','Lonely','Confused','Overwhelmed','Numb','Disconnected']],['Body reactions',['Chest tight','Heart racing','Shaky','Hot','Sick or nauseous','Heavy','Frozen','Restless','Hard to breathe','Can’t focus']],['Urges',['Want to message','Want reassurance','Want to argue','Want to withdraw','Want to escape','Want to keep checking']]]},
 {title:'What might you need?',help:'A need is not a demand or proof that anyone is wrong. Choose whatever would help you feel clearer, steadier, or respected.',type:'multi',chips:['Reassurance','Closeness','Clear information','Space','Repair','To be heard','Rest','Safety','Respect','Follow-through','Predictability','Comfort','More time','A boundary','Practical help','An apology']},
 {title:'What do you want to do next?',help:'You do not have to solve the whole situation. Choose the next small move that feels most useful.',type:'single',chips:['Wait before I do anything','Ask what happened','Tell them what I need','Write a message but don’t send it','Help the feeling pass first','Do one small practical thing','Leave this here and come back later']}
];
const pauseSteps=[
 {title:'What are you putting on hold?',help:'Choose anything you want to leave untouched for now.',type:'multi',chips:['Sending messages or calling','Continuing an argument','Making a relationship decision','Spending or ordering something','Posting online','Leaving or going somewhere','Something else']},
 {title:'What could make the pause easier?',help:'Choose any support that might give the urge somewhere safer to go.',type:'multi',chips:['Hide the draft','Put my phone down','Move to another room','Choose a carry-me-through activity','Write what I want to do without doing it','Ask Binch']},
 {title:'When do you want to return?',help:'You remain in charge of the pause. A timer is optional and does not create a notification.',type:'single',chips:['Return when I choose','After a short timer','After sleeping or resting','After I have more information','No decision yet']}
];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progress(){document.getElementById('progress').innerHTML=steps.map((_,i)=>`<i class="dot ${i<=state.step?'on':''}"></i>`).join('')}
function render(){clearInterval(window.pauseTimer);document.querySelector('.route').textContent='Help me understand';progress();const st=document.getElementById('stage');if(state.step>=steps.length)return renderSummary();const s=steps[state.step],a=state.answers[state.step];let body='';
 if(s.type==='text')body=`<textarea class="field" id="answer" placeholder="${s.placeholder}">${esc(a||'')}</textarea>`;
 if(s.type==='triplet')body=`<div class="triplet">${s.fields.map(([k,l,p])=>`<div class="mini"><label>${l}</label><textarea class="field" data-field="${k}" placeholder="${p}">${esc((a||{})[k]||'')}</textarea></div>`).join('')}</div>`;
 if(s.type==='multi'||s.type==='single')body=`<div class="chips">${s.chips.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div>`;
 if(s.type==='multiGrouped')body=s.groups.map(([label,items])=>`<div class="groupLabel">${label}</div><div class="chips">${items.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div>`).join('');
 st.className='stage';st.innerHTML=`<div class="step">Step ${state.step+1} of ${steps.length}</div><h1>${s.title}</h1><p class="explain">${s.help}</p>${body}<div class="actions"><button class="primary" id="next">${state.step===steps.length-1?'Show me the whole picture':'Continue'}</button><div class="secondary"><button id="back">${state.step?'Back':'Close'}</button><button id="unknown">I don’t know</button><button id="skip">Skip this</button></div></div>`;bind(s)}
function capture(s){if(s.type==='text')state.answers[state.step]=document.getElementById('answer').value.trim();if(s.type==='triplet'){const o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value.trim());state.answers[state.step]=o}}
function bind(s){document.getElementById('next').onclick=()=>{capture(s);state.step++;save();render()};document.getElementById('back').onclick=()=>{capture(s);if(state.step){state.step--;save();render()}else toast('This would return to I’m spiralling')};document.getElementById('skip').onclick=()=>{state.answers[state.step]='Skipped';state.step++;save();render()};document.getElementById('unknown').onclick=()=>{state.answers[state.step]='I don’t know';state.step++;save();render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let a=Array.isArray(state.answers[state.step])?state.answers[state.step]:[];if(s.type==='single')a=[b.dataset.choice];else a=a.includes(b.dataset.choice)?a.filter(x=>x!==b.dataset.choice):[...a,b.dataset.choice];state.answers[state.step]=a;save();render()})}
const labels=['What happened','What it seemed to mean','Known · unknown · predicted','Inside me','What I might need','What I want to do next'];
function answerText(i){const a=state.answers[i];if(!a||(Array.isArray(a)&&!a.length))return 'Not answered';if(Array.isArray(a))return a.join(' · ');if(typeof a==='object')return `Known: ${a.known||'—'} / Unknown: ${a.unknown||'—'} / Predicted: ${a.predicted||'—'}`;return a}
function renderSummary(){const st=document.getElementById('stage'),canPause=Array.isArray(state.answers[5])&&state.answers[5].includes('Wait before I do anything');st.className='stage summary';st.innerHTML=`<div class="step">Your assembled picture</div><h1>This can hold more than one truth.</h1>${labels.map((l,i)=>`<div class="row"><button data-edit="${i}">edit</button><b>${l}</b><span>${esc(answerText(i))}</span></div>`).join('')}<div class="choiceList">${canPause?'<button class="primary" id="continueChoice">Set up the pause</button>':''}<button class="binch" id="askBinch">Ask Binch with this context<span class="notbuilt">Copies reviewed context; Telegram opening is not wired yet</span></button><button class="choice" id="restart">Start again</button></div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.edit;save();render()});document.getElementById('restart').onclick=()=>{state.step=0;state.answers={};save();render()};document.getElementById('askBinch').onclick=openBinch;if(canPause)document.getElementById('continueChoice').onclick=()=>renderPause()}
function renderPause(){clearInterval(window.pauseTimer);const p=state.pause.step,s=pauseSteps[p],a=state.pause.answers[p]||[];document.querySelector('.route').textContent='Pause before acting';document.getElementById('progress').innerHTML=pauseSteps.map((_,i)=>`<i class="dot ${i<=p?'on':''}"></i>`).join('');const timerChoices=p===2&&a.includes('After a short timer')?`<div class="groupLabel">How long?</div><div class="chips">${[10,20,30,60].map(n=>`<button class="chip ${state.pause.duration===n?'selected':''}" data-duration="${n}">${n} minutes</button>`).join('')}</div>`:'';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Pause · Step ${p+1} of 3</div><h1>${s.title}</h1><p class="explain">${s.help}</p><div class="chips">${s.chips.map(c=>`<button class="chip ${a.includes(c)?'selected':''}" data-pchoice="${c}">${c}</button>`).join('')}</div>${timerChoices}<div class="actions"><button class="primary" id="pauseNext">${p===2?'Review the pause':'Continue'}</button><div class="secondary"><button id="pauseBack">Back</button><button id="pauseSkip">Skip this</button></div></div>`;document.querySelectorAll('[data-pchoice]').forEach(b=>b.onclick=()=>{let v=state.pause.answers[p]||[];v=s.type==='single'?[b.dataset.pchoice]:v.includes(b.dataset.pchoice)?v.filter(x=>x!==b.dataset.pchoice):[...v,b.dataset.pchoice];state.pause.answers[p]=v;save();renderPause()});document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{state.pause.duration=+b.dataset.duration;save();renderPause()});document.getElementById('pauseNext').onclick=()=>{if(p<2){state.pause.step++;save();renderPause()}else renderPauseReview()};document.getElementById('pauseBack').onclick=()=>{if(p){state.pause.step--;save();renderPause()}else renderSummary()};document.getElementById('pauseSkip').onclick=()=>{state.pause.answers[p]=['Skipped'];if(p<2){state.pause.step++;save();renderPause()}else renderPauseReview()}}
function pauseText(i){const a=state.pause.answers[i];return a&&a.length?a.join(' · '):'Nothing selected'}
function renderPauseReview(){clearInterval(window.pauseTimer);document.querySelector('.route').textContent='Pause before acting';document.getElementById('progress').innerHTML='<i class="dot on"></i><i class="dot on"></i><i class="dot on"></i>';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Your pause</div><h1>You can leave this untouched for now.</h1><div class="holdCard"><b>Putting on hold</b><span>${esc(pauseText(0))}</span></div><div class="holdCard"><b>What may help</b><span>${esc(pauseText(1))}</span></div><div class="holdCard"><b>When I’ll return</b><span>${esc(pauseText(2))}${state.pause.answers[2]?.includes('After a short timer')?` · ${state.pause.duration} minutes`:''}</span></div><p class="quietNote">This does not lock anything or create a notification. You can return, change it, or end it whenever you choose.</p><div class="actions"><button class="primary" id="beginPause">Begin the pause</button><div class="secondary"><button id="editPause">Change choices</button><button id="backSummary">Back to summary</button></div></div>`;document.getElementById('beginPause').onclick=()=>{state.pause.active=true;state.pause.started=Date.now();save();renderActivePause()};document.getElementById('editPause').onclick=()=>{state.pause.step=0;save();renderPause()};document.getElementById('backSummary').onclick=renderSummary}
function renderActivePause(){document.querySelector('.route').textContent='Pause in progress';document.getElementById('progress').innerHTML='';const timed=state.pause.answers[2]?.includes('After a short timer'),st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">For now</div><h1>The decision can wait.</h1><div class="holdCard"><b>Currently on hold</b><span>${esc(pauseText(0))}</span></div>${timed?'<div class="timerReadout" id="timerReadout"></div><p class="quietNote" id="timerNote">No notification will be created. Keep this page open if you want to watch the timer.</p>':'<p class="quietNote">There is no deadline. Return when you choose—not when the app demands an answer.</p>'}<div class="actions"><button class="primary" id="keepPause">Keep pausing</button><div class="secondary"><button id="reviewPause">Review choices</button><button id="endPause">End pause</button></div></div>`;const update=()=>{if(!timed)return;const end=state.pause.started+state.pause.duration*60000,left=Math.max(0,end-Date.now()),mins=Math.floor(left/60000),secs=Math.floor((left%60000)/1000),out=document.getElementById('timerReadout');if(out)out.textContent=left?`${mins}:${String(secs).padStart(2,'0')}`:'Timer finished';if(!left){clearInterval(window.pauseTimer);document.getElementById('timerNote').textContent='The timer ended. You can still keep waiting if you are not ready.'}};update();window.pauseTimer=setInterval(update,1000);document.getElementById('keepPause').onclick=()=>{if(timed&&Date.now()>=state.pause.started+state.pause.duration*60000){state.pause.started=Date.now();save();renderActivePause()}else toast('The pause is still yours')};document.getElementById('reviewPause').onclick=()=>{state.pause.active=false;save();renderPauseReview()};document.getElementById('endPause').onclick=()=>{state.pause.active=false;state.pause.started=null;state.pause.step=0;save();renderSummary()}}
let returnFromSettings=()=>state.pause.active?renderActivePause():render();
function renderSettings(){clearInterval(window.pauseTimer);document.querySelector('.route').textContent='Settings';document.getElementById('progress').innerHTML='';const supported='Notification' in window,permission=supported?Notification.permission:'unsupported',installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;let status=state.settings.notifications&&permission==='granted'?'On':permission==='denied'?'Blocked in iPhone settings':supported?'Off':'Not available in this browser';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Understory</div><h1>Settings</h1><div class="settingBlock"><h2>Reminders and notifications</h2><div class="statusLine">${status}</div><p>Only reminders you create can notify you. Notifications are off by default, and lock-screen wording stays neutral.</p><button class="toggleButton ${state.settings.notifications?'on':''}" id="notificationToggle">${state.settings.notifications?'Turn notifications off':'Enable notifications'}</button><p id="notificationHelp">${installed?'This Home Screen app can ask for notification permission when you enable it.':'On iPhone, add Understory to your Home Screen before enabling notifications.'}</p><button class="toggleButton ${state.settings.privateWording?'on':''}" id="wordingToggle">Private wording: ${state.settings.privateWording?'On':'Off'}</button><p>Private wording uses “Understory reminder” instead of showing personal details on your Lock Screen.</p><span class="notbuilt">Creating individual reminders and background push delivery are not built yet.</span></div><div class="settingBlock"><h2>Privacy and storage</h2><p>Your entries and settings stay in this browser. Nothing is sent to a server. Clearing Safari website data will remove them.</p></div><div class="settingBlock"><h2>Install on iPhone</h2><div class="statusLine">${installed?'Opened as Home Screen app':'Browser version'}</div><p>${installed?'Understory is running in standalone app mode.':'In Safari, tap Share, then Add to Home Screen. Open it from the new leaf icon.'}</p></div><div class="actions"><button class="primary" id="settingsBack">Back</button></div>`;document.getElementById('settingsBack').onclick=returnFromSettings;document.getElementById('wordingToggle').onclick=()=>{state.settings.privateWording=!state.settings.privateWording;save();renderSettings()};document.getElementById('notificationToggle').onclick=async()=>{if(state.settings.notifications){state.settings.notifications=false;save();renderSettings();return}if(!supported){toast('Notifications are not available here');return}if(!installed&&/iPhone|iPad|iPod/.test(navigator.userAgent)){toast('Add Understory to your Home Screen first');return}const result=await Notification.requestPermission();state.settings.notifications=result==='granted';save();renderSettings();if(result!=='granted')toast('Notification permission was not enabled')}}
function openBinch(){document.getElementById('contextText').value=`I’m using Understory and want help understanding what happened.\n\n${labels.map((l,i)=>`${l}: ${answerText(i)}`).join('\n')}\n\nPlease help me separate what I know from what I’m predicting, without assuming my concerns are imaginary.`;document.getElementById('modal').classList.add('open')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('copyContext').onclick=async()=>{const t=document.getElementById('contextText');try{await navigator.clipboard.writeText(t.value);toast('Copied to clipboard')}catch{t.select();document.execCommand('copy');toast('Copied to clipboard')}};document.querySelector('.close').onclick=()=>toast('This would return to I’m spiralling');document.getElementById('settingsButton').onclick=()=>{const route=document.querySelector('.route').textContent;returnFromSettings=state.pause.active?renderActivePause:route.startsWith('Pause')?renderPause:render;renderSettings()};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));state.pause.active?renderActivePause():render();
</script></body></html>
