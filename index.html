</style></head><body><main class="phone"><header class="top"><div class="route">Help me understand</div><div class="topActions"><button class="settingsButton" id="settingsButton" aria-label="Settings">⚙</button><button class="close" aria-label="Close">×</button></div></header><div class="progress" id="progress"></div><section class="stage" id="stage"></section><div class="modal" id="modal"><div class="paper"><h2>Context for Binch</h2><p>Review this first. Nothing is sent automatically.</p><textarea id="contextText"></textarea><div class="buttons"><button id="copyContext">Copy text</button><button class="alt" id="closeModal">Close</button></div><span class="notbuilt">Opening Telegram is not wired in this review prototype.</span></div></div><div class="toast" id="toast">Copied to clipboard</div></main><script>
const KEY='understory-understand-flow-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{"step":0,"answers":{}}');
state.pause=state.pause||{step:0,answers:{0:[],1:[],2:['Return when I choose']},duration:20,active:false,started:null};
state.pause.draft=state.pause.draft||{text:'',locked:false,lockedAt:null};
state.journal=state.journal||[];
state.selfMap=state.selfMap||[];
state.carry=state.carry||{step:0,answers:{}};
state.spiral=state.spiral||{context:'',hold:'',later:''};
state.page=state.page||'home';
const steps=[
 {title:'What happened?',help:'Write only what someone could have seen or heard. You do not need to explain why yet.',type:'text',placeholder:'Write what happened here…'},
 {title:'What did your mind say it meant?',help:'Write the meaning, fear, or prediction that arrived. Calling it a meaning does not mean it is wrong.',type:'text',placeholder:'Write what it seemed to mean…'},
 {title:'What do you actually know?',help:'Separate what is confirmed from what is still unknown or being predicted.',type:'triplet',fields:[['known','Known','What is directly confirmed?'],['unknown','Unknown','What information do you not have?'],['predicted','Predicted','What is your mind expecting will happen?']]},
 {title:'What is happening inside you?',help:'Choose anything that fits. Feelings, body reactions, and urges can all be true at once.',type:'multiGrouped',groups:[['Feelings',['Panicked','Angry','Hurt','Sad','Afraid','Ashamed','Rejected','Lonely','Confused','Overwhelmed','Numb','Disconnected']],['Body reactions',['Chest tight','Heart racing','Shaky','Hot','Sick or nauseous','Heavy','Frozen','Restless','Hard to breathe','Can’t focus']],['Urges',['Want to message','Want reassurance','Want to argue','Want to withdraw','Want to escape','Want to keep checking']]]},
 {title:'What might you need?',help:'A need is not a demand or proof that anyone is wrong. Choose whatever would help you feel clearer, steadier, or respected.',type:'multi',chips:['Reassurance','Closeness','Clear information','Space','Repair','To be heard','Rest','Safety','Respect','Follow-through','Predictability','Comfort','More time','A boundary','Practical help','An apology']},
 {title:'What do you want to do next?',help:'You do not have to solve the whole situation. Choose the next small move that feels most useful.',type:'single',chips:['Wait before I do anything','Ask what happened','Tell them what I need','Write a message but don’t send it','Help the feeling pass first','Do one small practical thing','Leave this here and come back later']}
];
const pauseSteps=[
 {title:'What are you putting on hold?',help:'Choose anything you want to leave untouched for now.',type:'multi',chips:['Sending messages or calling','Continuing an argument','Making a relationship decision','Spending or ordering something','Posting online','Leaving or going somewhere','Something else']},
 {title:'How do you want to clear some of it out?',help:'Choose something Understory can actively help you do here.',type:'multi',chips:['Write what I want to do without doing it','Work out what I need to say','Separate facts from assumptions','Choose a carry-me-through activity','Ask Binch']},
 {title:'When do you want to return?',help:'You remain in charge of the pause. A timer is optional and only runs inside Understory.',type:'single',chips:['Return when I choose','After a short timer','After sleeping or resting','After I have more information','No decision yet']}
];
const carrySteps=[
 {title:'What is loudest inside you?',help:'Choose whatever is here. You do not need to make it neat first.',type:'grouped',groups:[['Feelings',['Panicked','Angry','Hurt','Sad','Afraid','Ashamed','Rejected','Lonely','Confused','Overwhelmed','Numb']],['Body',['Chest tight','Heart racing','Shaky','Hot','Sick','Heavy','Frozen','Restless','Can’t focus']],['Urges',['Message or call','Argue','Keep checking','Withdraw','Escape','Spend or post','Make a big decision']]]},
 {title:'What happened right before it got this loud?',help:'Describe the moment, message, memory, silence, thought, or body change that came just before it. “I don’t know” is useful information too.',type:'text',placeholder:'What happened just before…'},
 {title:'Why might it have landed so hard?',help:'These are possible contributors, not a verdict about you or anyone else.',type:'multi',chips:['Uncertainty','Possible rejection','Conflict or changed tone','Feeling ignored','A need was not met','A boundary was crossed','Old pain feels similar','Exhaustion or poor sleep','Hunger, illness, or hormones','Sensory overload','Shame or self-blame','Too many things at once']},
 {title:'What did your mind say this means?',help:'Name the feared meaning or prediction. We can take it seriously without automatically treating it as fact.',type:'text',placeholder:'My mind said this means…'}
];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progress(){document.getElementById('progress').innerHTML=steps.map((_,i)=>`<i class="dot ${i<=state.step?'on':''}"></i>`).join('')}
function paperize(){const st=document.getElementById('stage');if(st.querySelector(':scope > .answerPaper'))return;const anchor=st.querySelector('.leafRule')||st.querySelector('h1');if(!anchor||!anchor.nextSibling)return;const paper=document.createElement('div');paper.className='answerPaper';while(anchor.nextSibling)paper.appendChild(anchor.nextSibling);st.appendChild(paper)}
const paperObserver=new MutationObserver(paperize);paperObserver.observe(document.getElementById('stage'),{childList:true});
function renderHome(){clearInterval(window.pauseTimer);state.page='home';save();document.querySelector('.route').textContent='private · local';document.querySelector('.close').style.visibility='hidden';document.getElementById('progress').innerHTML='';const resume=state.pause.active?'<button class="homeAction" id="resumePause">Resume my pause</button><p class="homeDetail">The decision is still waiting.</p>':'';const locked=state.pause.draft.locked?'<button class="homeAction" id="resumeDraft">Open my locked draft</button><p class="homeDetail">The draft remains sealed from view.</p>':'';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="homeBrand">Understory</div><div class="leafRule"><i></i><i></i><i></i><i></i></div><p class="explain">A quiet place to return to.</p>${resume}${locked}<button class="homeAction" id="homeSpiral">I’m spiralling</button><p class="homeDetail">Help me through the peak.</p><button class="homeAction" id="homeClarity">Help me understand what happened</button><p class="homeDetail">Separate what happened from what your mind is filling in.</p><button class="homeAction" id="homeJournal">My journal</button><p class="homeDetail">Keep pieces of yourself somewhere you can find them.</p>`;if(state.pause.active)document.getElementById('resumePause').onclick=renderActivePause;if(state.pause.draft.locked)document.getElementById('resumeDraft').onclick=renderLockedDraft;document.getElementById('homeSpiral').onclick=renderSpiralHub;document.getElementById('homeClarity').onclick=()=>{state.page='clarity';save();render()};document.getElementById('homeJournal').onclick=renderJournal}
function spiralFrame(route='I’m spiralling'){state.page='spiral';save();document.querySelector('.route').textContent=route;document.querySelector('.close').style.visibility='visible';document.getElementById('progress').innerHTML='';const st=document.getElementById('stage');st.className='stage';return st}
function renderSpiralHub(){const st=spiralFrame();st.innerHTML=`<div class="step">Start here</div><h1>Tell me what’s happening.</h1><p class="explain">One place to put it. Understory will carry this with you instead of making you explain it again.</p><textarea class="field" id="spiralContext" placeholder="What happened, what is running through your head, or what you are trying not to do…">${esc(state.spiral.context||'')}</textarea><div class="actions"><button class="primary" id="spiralContinue">Show me what could help</button><div class="secondary"><button id="spiralHome">Back home</button></div></div>`;document.getElementById('spiralContinue').onclick=()=>{const context=document.getElementById('spiralContext').value.trim();if(!context){toast('Write whatever part you can');return}state.spiral.context=context;save();renderSpiralPaths()};document.getElementById('spiralHome').onclick=renderHome}
function renderSpiralPaths(){const st=spiralFrame();st.innerHTML=`<div class="step">Same context · different kinds of help</div><h1>What do you need from this?</h1><div class="spiralContextCard">${esc(state.spiral.context)}</div><button class="supportPath" id="pathImpulse">I might do something impulsive<small>Put the action somewhere safe without doing it.</small></button><button class="supportPath" id="pathCarry">Stay with me through the peak<small>No more questions first.</small></button><button class="supportPath" id="pathUnderstand">Help me understand why this hit me<small>Use what I already wrote as the event.</small></button><button class="supportPath" id="pathLater">Help me work out what to say or do later<small>Make a deliberate draft, request, boundary, or next step.</small></button><button class="supportPath" id="pathBinch">Ask Binch<small>Review this context before copying it.</small></button><div class="secondary"><button id="editSpiralContext">Edit what I wrote</button><button id="spiralPathsHome">Back home</button></div>`;document.getElementById('pathImpulse').onclick=renderImpulseHold;document.getElementById('pathCarry').onclick=renderCarryNow;document.getElementById('pathUnderstand').onclick=()=>{state.answers[0]=state.spiral.context;state.step=1;save();render()};document.getElementById('pathLater').onclick=renderLaterPlan;document.getElementById('pathBinch').onclick=openBinch;document.getElementById('editSpiralContext').onclick=renderSpiralHub;document.getElementById('spiralPathsHome').onclick=renderHome}
function renderImpulseHold(){const st=spiralFrame('Pause before acting');st.innerHTML=`<div class="step">Put the action here first</div><h1>What are you putting on hold?</h1><p class="explain">Name the message, call, argument, purchase, post, decision, or other action. The draft comes next—no extra process in between.</p><textarea class="field" id="heldAction" placeholder="I’m putting off…">${esc(state.spiral.hold||'')}</textarea><div class="actions"><button class="primary" id="writeHeldDraft">Write it without doing it</button><div class="secondary"><button id="holdBack">Back</button></div></div>`;document.getElementById('writeHeldDraft').onclick=()=>{const hold=document.getElementById('heldAction').value.trim();if(!hold){toast('Name what you are putting on hold');return}state.spiral.hold=hold;state.pause.answers[0]=[hold];state.pause.answers[1]=['Write what I want to do without doing it'];if(!state.pause.draft.locked)state.pause.draft.text='';save();renderDraftBox()};document.getElementById('holdBack').onclick=renderSpiralPaths}
function renderCarryNow(){clearInterval(window.carryTimer);const st=spiralFrame('Stay with me');st.innerHTML=`<div class="step">No more questions first</div><h1>We can stay here without solving it.</h1><div class="spiralContextCard">${esc(state.spiral.context)}</div><div class="lowDemand" id="carryNowPrompt">For the next moment, the only job is not to obey the urgency. Let your body be held by what is underneath it.</div><button class="primary" id="stayWithScreen">Stay with this screen</button><button class="supportPath" id="carryPhysical">Give me one physical thing to do<small>One instruction, not a list.</small></button><div class="secondary"><button id="carryContextBack">Choose different help</button><button id="carryHome">Back home</button></div>`;document.getElementById('stayWithScreen').onclick=renderCarryStaySimple;document.getElementById('carryPhysical').onclick=()=>{const prompts=['Press both feet down and notice the pressure for ten seconds.','Hold something cool and describe only its temperature and weight.','Push your palms together slowly, then release them more slowly.'];const box=document.getElementById('carryNowPrompt');box.textContent=prompts[(+(box.dataset.index||-1)+1)%prompts.length];box.dataset.index=(+(box.dataset.index||-1)+1)%prompts.length};document.getElementById('carryContextBack').onclick=renderSpiralPaths;document.getElementById('carryHome').onclick=renderHome}
function renderCarryStaySimple(){clearInterval(window.carryTimer);const st=spiralFrame('Stay with me'),started=Date.now(),prompts=['Nothing to solve. Stay physically supported.','Find one neutral shape and let your eyes rest there.','Notice the urge as pressure or motion. It can exist without becoming an instruction.','Choose only what happens after this minute: remain here, change support, or rest.'];st.innerHTML=`<div class="step">One minute · no analysis</div><h1>Let the peak move without following it.</h1><div class="timerReadout" id="carrySimpleClock">1:00</div><div class="lowDemand" id="carrySimplePrompt">${prompts[0]}</div><div class="actions"><button class="primary" id="leaveCarryMinute">Choose different help</button></div>`;const update=()=>{const elapsed=Math.floor((Date.now()-started)/1000),left=Math.max(0,60-elapsed);document.getElementById('carrySimpleClock').textContent=left?`0:${String(left).padStart(2,'0')}`:'You stayed';document.getElementById('carrySimplePrompt').textContent=prompts[Math.min(3,Math.floor(elapsed/15))];if(!left)clearInterval(window.carryTimer)};window.carryTimer=setInterval(update,1000);document.getElementById('leaveCarryMinute').onclick=renderSpiralPaths}
function renderLaterPlan(){const st=spiralFrame('For later');st.innerHTML=`<div class="step">Use the context you already gave</div><h1>What would you like to say or do later?</h1><div class="spiralContextCard">${esc(state.spiral.context)}</div><textarea class="field" id="laterPlan" placeholder="A request, boundary, clarification, repair, decision, or next step…">${esc(state.spiral.later||'')}</textarea><div class="actions"><button class="primary" id="saveLaterPlan">Save this for later</button><div class="secondary"><button id="laterBack">Choose different help</button></div></div>`;document.getElementById('saveLaterPlan').onclick=()=>{state.spiral.later=document.getElementById('laterPlan').value.trim();save();toast('Saved locally for later')};document.getElementById('laterBack').onclick=renderSpiralPaths}
function renderSupport(title,help,options){document.querySelector('.route').textContent='I’m spiralling';document.getElementById('progress').innerHTML='';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">One gentle next step</div><h1>${title}</h1><p class="explain">${help}</p><div class="choiceList">${options.map(o=>`<button class="choice" data-support="${o}">${o}</button>`).join('')}</div><p class="quietNote" id="supportNote">Choose one if it helps. You can also leave this unresolved.</p><div class="actions"><button class="primary" id="supportBack">Back</button></div>`;document.querySelectorAll('[data-support]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-support]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('supportNote').textContent=`For now: ${b.dataset.support}. That is enough of a plan.`});document.getElementById('supportBack').onclick=renderSpiralHub}
function renderCarry(){clearInterval(window.carryTimer);state.page='carry';save();document.querySelector('.route').textContent='Carry me through';document.querySelector('.close').style.visibility='visible';const i=state.carry.step,s=carrySteps[i];if(i>=carrySteps.length)return renderCarryPlan();document.getElementById('progress').innerHTML=carrySteps.map((_,n)=>`<i class="dot ${n<=i?'on':''}"></i>`).join('');const a=state.carry.answers[i];let body='';if(s.type==='text')body=`<textarea class="field" id="carryText" placeholder="${s.placeholder}">${esc(a||'')}</textarea>`;if(s.type==='multi')body=`<div class="chips">${s.chips.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-carry="${c}">${c}</button>`).join('')}</div>`;if(s.type==='grouped')body=s.groups.map(([label,items])=>`<div class="groupLabel">${label}</div><div class="chips">${items.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-carry="${c}">${c}</button>`).join('')}</div>`).join('');const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Carry · ${i+1} of ${carrySteps.length}</div><h1>${s.title}</h1><p class="explain">${s.help}</p>${body}<div class="actions"><button class="primary" id="carryNext">${i===carrySteps.length-1?'Help me make sense of this':'Continue'}</button><div class="secondary"><button id="carryBack">${i?'Back':'Back to choices'}</button><button id="carryUnknown">I don’t know</button></div></div>`;const capture=()=>{if(s.type==='text')state.carry.answers[i]=document.getElementById('carryText').value.trim()};document.querySelectorAll('[data-carry]').forEach(b=>b.onclick=()=>{let v=Array.isArray(state.carry.answers[i])?state.carry.answers[i]:[];v=v.includes(b.dataset.carry)?v.filter(x=>x!==b.dataset.carry):[...v,b.dataset.carry];state.carry.answers[i]=v;save();renderCarry()});document.getElementById('carryNext').onclick=()=>{capture();state.carry.step++;save();renderCarry()};document.getElementById('carryBack').onclick=()=>{capture();if(i){state.carry.step--;save();renderCarry()}else renderSpiralHub()};document.getElementById('carryUnknown').onclick=()=>{state.carry.answers[i]=s.type==='text'?'I don’t know':['I don’t know'];state.carry.step++;save();renderCarry()}}
function carryAnalysis(){const loud=Array.isArray(state.carry.answers[0])?state.carry.answers[0]:[],why=Array.isArray(state.carry.answers[2])?state.carry.answers[2]:[],insights=[],now=[],later=[];if(loud.some(x=>['Panicked','Afraid','Chest tight','Heart racing','Shaky','Frozen'].includes(x))){insights.push('Your body appears to be in alarm mode. Alarm makes uncertain information feel immediate and conclusive, even when the facts are still incomplete.');now.push('Lower the physical alarm first: support your body, loosen your jaw and shoulders, and make the next ten minutes decision-free.')}if(loud.some(x=>['Rejected','Lonely','Hurt'].includes(x))||why.includes('Possible rejection')){insights.push('This may be touching the need to feel chosen, secure, or connected. That can make distance or ambiguity hurt far beyond the visible moment.');later.push('Notice which forms of reassurance genuinely settle you and practise asking for one specific thing instead of trying to prove the whole relationship is safe.')}if(loud.includes('Angry')||why.includes('A boundary was crossed')||why.includes('Feeling ignored')){insights.push('Anger may be carrying information: something felt dismissive, unfair, obstructed, or beyond your limit. Calming down does not automatically mean the underlying problem was imaginary.');now.push('Write the concrete behaviour or unmet boundary in one sentence. Leave motives out until you have more information.');later.push('Turn repeated anger into a clear boundary or request, then watch what actually happens rather than arguing with yourself about whether you are allowed to mind.')}if(why.includes('Old pain feels similar')){insights.push('The present moment may resemble an older wound closely enough that your system is responding to both at once. Similarity is not proof that the same ending is happening again.');later.push('Track the recurring cue, the prediction it creates, and what evidence or response helps you return to the present.')}if(why.some(x=>['Exhaustion or poor sleep','Hunger, illness, or hormones','Sensory overload','Too many things at once'].includes(x))){insights.push('Your capacity may already be depleted. That does not make the feeling fake; it means there is less room available to absorb it.');now.push('Reduce one source of load—noise, light, conversation, hunger, standing, or another demand—before requiring yourself to reason perfectly.');later.push('Treat low-capacity states as a predictable vulnerability and prepare a smaller plan for those days.')}if(why.includes('Uncertainty')){insights.push('Uncertainty gives the mind room to manufacture an answer, usually the one it is most afraid of. The prediction may be possible without being confirmed.');now.push('Separate what is confirmed, what is missing, and what you are predicting. Decide whether clarification is possible now or whether this needs to wait.')}if(why.includes('A need was not met')){insights.push('Part of the intensity may be a real unmet need rather than a feeling you are supposed to erase.');now.push('Name the need plainly—closeness, clarity, respect, repair, rest, or practical follow-through—without first proving you deserve it.')}if(why.includes('Shame or self-blame')||loud.includes('Ashamed')){insights.push('Shame turns a difficult moment into a verdict about who you are. A behaviour can need repair without your whole self becoming the crime scene.');later.push('Practise describing what you did, wanted, or feared without converting it into a permanent identity statement.')}if(!insights.length)insights.push('The trigger, your current capacity, the meaning your mind attached, and any older resemblance may all be contributing. You do not need one perfect explanation before receiving support.');if(!now.length)now.push('Do one thing that reduces demand: sit somewhere supported, put the phone down briefly, drink something, or choose one familiar absorbing activity.');if(!later.length)later.push('When the peak passes, note what triggered it, what you predicted, what you actually needed, and which response helped. Patterns become workable when they are specific.');return{insights,now,later}}
function renderCarryPlan(){state.carry.step=carrySteps.length;save();document.querySelector('.route').textContent='Carry me through';document.getElementById('progress').innerHTML=carrySteps.map(()=>'<i class="dot on"></i>').join('');const a=carryAnalysis(),trigger=state.carry.answers[1]||'Not clear yet',meaning=state.carry.answers[3]||'Not clear yet',st=document.getElementById('stage');st.className='stage summary';st.innerHTML=`<div class="step">A working explanation</div><h1>Why this may be happening</h1><p class="quietNote">This is a set of possibilities, not a diagnosis or a verdict about the situation.</p><div class="holdCard"><b>What set it off</b><span>${esc(trigger)}</span></div><div class="holdCard"><b>What your mind said it meant</b><span>${esc(meaning)}</span></div>${a.insights.map(x=>`<div class="row"><b>Possible piece</b><span>${esc(x)}</span></div>`).join('')}<div class="groupLabel">What may help right now</div>${a.now.map(x=>`<div class="row"><span>${esc(x)}</span></div>`).join('')}<div class="groupLabel">Ways to work on it over time</div>${a.later.map(x=>`<div class="row"><span>${esc(x)}</span></div>`).join('')}<p class="quietNote">A nervous-system reaction and a genuine external problem can exist at the same time. Settling the peak does not excuse harmful behaviour or erase your needs.</p><button class="primary" id="carryStay">Stay with me for one minute</button><div class="secondary"><button id="carryEdit">Change my answers</button><button id="carryDone">Back to choices</button></div>`;document.getElementById('carryStay').onclick=renderCarryStay;document.getElementById('carryEdit').onclick=()=>{state.carry.step=0;save();renderCarry()};document.getElementById('carryDone').onclick=renderSpiralHub}
function renderCarryStay(){clearInterval(window.carryTimer);document.querySelector('.route').textContent='Stay with me';document.getElementById('progress').innerHTML='';const started=Date.now(),st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Nothing to solve for one minute</div><h1>Stay here. The urge can move without being obeyed.</h1><div class="timerReadout" id="carryClock">1:00</div><p class="explain" id="carryPrompt">Let your body be supported by whatever is underneath you. Unclench one thing.</p><div class="actions"><button class="primary" id="carryPlan">Return to my explanation</button><div class="secondary"><button id="carrySwitch">Choose another kind of help</button></div></div>`;const prompts=['Let your body be supported by whatever is underneath you. Unclench one thing.','Find three neutral things you can see. Nothing has to become beautiful.','Notice the urge as pressure, heat, movement, or noise. You do not have to follow it.','Decide only the next small thing: continue resting, use one suggestion, or leave this unresolved.'];const update=()=>{const elapsed=Math.floor((Date.now()-started)/1000),left=Math.max(0,60-elapsed),clock=document.getElementById('carryClock');if(!clock)return;clock.textContent=left?`0:${String(left).padStart(2,'0')}`:'You stayed';document.getElementById('carryPrompt').textContent=prompts[Math.min(3,Math.floor(elapsed/15))];if(!left)clearInterval(window.carryTimer)};update();window.carryTimer=setInterval(update,1000);document.getElementById('carryPlan').onclick=renderCarryPlan;document.getElementById('carrySwitch').onclick=renderSpiralHub}
const mapCategories=['Traits and ways I am','Things I enjoy','Values and opinions','Strengths and abilities','Needs and boundaries','People, animals, and places','Memories','Goals and future'];
function renderJournal(){renderSelfMap()}
const graphPalette=['#6f7ee8','#e59a4b','#4f9da6','#5d9fda','#d75e7a','#e1c94f','#7edca8','#9a74c8'];
let graphCamera={cx:400,cy:300,w:800,h:500},selectedGraphId='me';
function graphData(){const nodes=[{id:'me',label:'Me',type:'self',x:400,y:300,r:40,color:'#6f72df'}],edges=[];mapCategories.forEach((category,ci)=>{const angle=-Math.PI/2+ci*Math.PI*2/mapCategories.length,cx=400+Math.cos(angle)*178,cy=300+Math.sin(angle)*178,cid=`cat-${ci}`;nodes.push({id:cid,label:category,type:'category',x:cx,y:cy,r:24,color:graphPalette[ci],category});edges.push(['me',cid]);const traits=state.selfMap.filter(x=>x.category===category);traits.forEach((trait,ti)=>{const spread=(ti-(traits.length-1)/2)*55,tx=cx+Math.cos(angle)*118-Math.sin(angle)*spread,ty=cy+Math.sin(angle)*118+Math.cos(angle)*spread,tid=`trait-${trait.id}`;nodes.push({id:tid,label:trait.trait,type:'trait',x:tx,y:ty,r:17,color:graphPalette[ci],category,record:trait});edges.push([cid,tid]);[['good',trait.good,'#72c99b'],['bad',trait.bad,'#c76569']].forEach(([kind,label,color],oi)=>{if(!label)return;const side=oi?-25:25,ox=tx+Math.cos(angle)*82-Math.sin(angle)*side,oy=ty+Math.sin(angle)*82+Math.cos(angle)*side,oid=`${kind}-${trait.id}`;nodes.push({id:oid,label,type:kind,x:ox,y:oy,r:10,color,category,record:trait});edges.push([tid,oid])})})});return{nodes,edges}}
function renderJournal(){renderGraph()}

function clampGraphCamera(){graphCamera.w=Math.max(260,Math.min(800,graphCamera.w));graphCamera.h=graphCamera.w*.625;const margin=200;graphCamera.cx=Math.max(graphCamera.w/2-margin,Math.min(800-graphCamera.w/2+margin,graphCamera.cx));graphCamera.cy=Math.max(graphCamera.h/2-margin,Math.min(600-graphCamera.h/2+margin,graphCamera.cy));return graphCamera}
function applyGraphCamera(){clampGraphCamera();document.getElementById('mapSvg')?.setAttribute('viewBox',`${graphCamera.cx-graphCamera.w/2} ${graphCamera.cy-graphCamera.h/2} ${graphCamera.w} ${graphCamera.h}`)}
let suppressGraphClick=false;
function bindGraphGestures(svg){const activePointers=new Map();let gesture=null,moved=false;const point=e=>({x:e.clientX,y:e.clientY}),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
 svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch{}activePointers.set(e.pointerId,point(e));moved=false;svg.classList.add('dragging');const pts=[...activePointers.values()];if(activePointers.size===1)gesture={type:'pan',start:pts[0],cx:graphCamera.cx,cy:graphCamera.cy,w:graphCamera.w};if(activePointers.size===2)gesture={type:'pinch',startMid:midpoint(pts[0],pts[1]),startDistance:Math.max(1,distance(pts[0],pts[1])),cx:graphCamera.cx,cy:graphCamera.cy,w:graphCamera.w}});
 svg.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;e.preventDefault();activePointers.set(e.pointerId,point(e));const rect=svg.getBoundingClientRect(),pts=[...activePointers.values()];if(activePointers.size===1&&gesture?.type==='pan'){const dx=pts[0].x-gesture.start.x,dy=pts[0].y-gesture.start.y;if(Math.hypot(dx,dy)>3)moved=true;graphCamera.cx=gesture.cx-dx*gesture.w/rect.width;graphCamera.cy=gesture.cy-dy*(gesture.w*.625)/rect.height;applyGraphCamera()}else if(activePointers.size===2){if(gesture?.type!=='pinch')gesture={type:'pinch',startMid:midpoint(pts[0],pts[1]),startDistance:Math.max(1,distance(pts[0],pts[1])),cx:graphCamera.cx,cy:graphCamera.cy,w:graphCamera.w};const mid=midpoint(pts[0],pts[1]),ratio=gesture.startDistance/Math.max(1,distance(pts[0],pts[1]));if(Math.abs(ratio-1)>.015||Math.hypot(mid.x-gesture.startMid.x,mid.y-gesture.startMid.y)>3)moved=true;graphCamera.w=gesture.w*ratio;graphCamera.cx=gesture.cx-(mid.x-gesture.startMid.x)*gesture.w/rect.width;graphCamera.cy=gesture.cy-(mid.y-gesture.startMid.y)*(gesture.w*.625)/rect.height;applyGraphCamera()}});
 const finish=e=>{if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);if(moved){suppressGraphClick=true;setTimeout(()=>suppressGraphClick=false,120)}const pts=[...activePointers.values()];if(activePointers.size===1)gesture={type:'pan',start:pts[0],cx:graphCamera.cx,cy:graphCamera.cy,w:graphCamera.w};else if(!activePointers.size){gesture=null;svg.classList.remove('dragging')}};svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish)}

function selectGraphNode(node,show){selectedGraphId=node.id;show(node.id)}
function zoomSelectedNode(data,factor){const node=data.nodes.find(n=>n.id===selectedGraphId)||data.nodes[0];graphCamera.w=Math.max(260,Math.min(800,graphCamera.w/factor));graphCamera.h=graphCamera.w*.625;if(graphCamera.w<800){graphCamera.cx=node.x;graphCamera.cy=node.y}else{graphCamera.cx=400;graphCamera.cy=300}applyGraphCamera()}

function leafArtwork(size,kind,variant=0){const shape=naturalLeafShape(variant),dry=kind==='leaf--dry';return `<g transform="scale(${size})"><path class="pothosLeaf ${kind}" d="${shape}"/>${dry?`<path class="dryMottle" d="M-.68 -.2 C-.48 -.45 -.28 -.3 -.22 -.08 C-.38 .04 -.54 .02 -.68 -.2 Z M.22 .18 C.48 .04 .68 .28 .58 .52 C.32 .58 .18 .43 .22 .18 Z M-.18 .68 C-.04 .52 .18 .64 .12 .88 C-.08 .9 -.2 .82 -.18 .68 Z"/>`:''}<path class="leafVein" d="M0 -0.86 Q-.02 .12 .02 1.22 M-.01 -.42 Q-.36 -.34 -.62 -.08 M0 -.18 Q.36 -.16 .65 .12 M.01 .18 Q-.36 .22 -.64 .48 M.02 .45 Q.34 .48 .55 .72"/></g>`}
function renderPothosLeaf(node){const size=node.type==='category'?18:node.type==='trait'?13:9,angle=Math.atan2(node.y-300,node.x-400)*180/Math.PI+90,kind=node.type==='good'?'leaf--healthy':node.type==='bad'?'leaf--dry':node.type==='category'?'leaf--category':'leaf--neutral',variant=String(node.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%3;return `<g data-graph-node="${node.id}" tabindex="0" role="button" aria-label="${esc(node.label)}" transform="translate(${node.x} ${node.y}) rotate(${angle})"><circle class="graphHit" r="${Math.max(31,size+13)}"/>${leafArtwork(size,kind,variant)}<title>${esc(node.label)}</title></g>`}
function renderCentralPothos(){const leaves=[[-24,-26,18,-36,0],[1,-38,22,4,1],[27,-22,17,40,2],[-32,0,16,-72,1],[30,3,17,74,0],[-6,-6,20,-7,2]];return `<g class="centralPothos" data-graph-node="me" tabindex="0" role="button" aria-label="Me"><circle class="graphHit" cx="400" cy="300" r="62"/><path class="centralStem" d="M400 324 Q387 284 369 265 M401 324 Q409 280 431 268 M400 324 Q399 274 402 248 M397 320 Q372 301 357 298"/>${leaves.map(([dx,dy,size,rot,v])=>`<g transform="translate(${400+dx} ${300+dy}) rotate(${rot})">${leafArtwork(size,'leaf--healthy',v)}</g>`).join('')}<ellipse class="potShadow" cx="400" cy="358" rx="25" ry="4"/><path class="plantPot" d="M376 316 C384 313 416 313 424 316 L418 352 Q400 360 382 352 Z"/><path class="potHighlight" d="M385 323 Q388 341 389 348"/><path class="plantRim" d="M372 311 Q400 305 428 311 L424 322 Q400 327 376 322 Z"/></g>`}
function renderVine(a,b,index){const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),side=index%2?1:-1,bend=side*(a.type==='self'?30:17),c1x=a.x+dx*.3-dy/len*bend,c1y=a.y+dy*.3+dx/len*bend,c2x=a.x+dx*.7-dy/len*bend*.48,c2y=a.y+dy*.7+dx/len*bend*.48,fine=a.type!=='self'?' graphVine--fine':'';return `<path class="graphVine${fine}" d="M ${a.x} ${a.y} C ${c1x} ${c1y} ${c2x} ${c2y} ${b.x} ${b.y}"/>`}
function renderGraph(){state.page='journal';save();document.querySelector('.route').textContent='My journal';document.querySelector('.close').style.visibility='visible';document.getElementById('progress').innerHTML='';selectedGraphId='me';graphCamera={cx:400,cy:300,w:800,h:500};const data=graphData(),byId=Object.fromEntries(data.nodes.map(n=>[n.id,n])),vines=data.edges.map(([a,b],i)=>renderVine(byId[a],byId[b],i)).join(''),plant=renderCentralPothos(),leaves=data.nodes.filter(n=>n.id!=='me').map(renderPothosLeaf).join('');const st=document.getElementById('stage');st.className='stage graphStage';st.innerHTML=`<div class="step">One plant · many branches</div><h1>See what grows from you.</h1><div class="graphControls"><button id="graphIn" aria-label="Zoom in">+</button><button id="graphOut" aria-label="Zoom out">−</button><button id="graphHome" aria-label="Back to Me">Me</button></div><div class="graphViewport"><svg id="mapSvg" viewBox="0 0 800 600" aria-label="Interactive pothos map of me">${plantDefs()}<g id="graphWorld">${vines}${plant}${leaves}</g></svg></div><div class="nodeDetail" id="nodeDetail" aria-live="polite"><div class="nodeType">Choose a leaf</div><h2>Tap part of the pothos</h2><p class="nodeConnections">Drag with one finger to explore. Pinch with two fingers to zoom. Tap a leaf to read it.</p></div><button class="primary" id="mapAdd">Grow a new branch</button>${state.journal.length?`<div class="groupLabel">Earlier journal pieces</div>${state.journal.map(p=>`<div class="journalPiece"><p>${esc(p.text)}</p></div>`).join('')}`:''}`;bindGraph(data);document.getElementById('mapAdd').onclick=()=>renderMapAdd()}
function bindGraph(data){const svg=document.getElementById('mapSvg'),byId=Object.fromEntries(data.nodes.map(n=>[n.id,n]));const show=id=>{const n=byId[id],connected=data.edges.filter(e=>e.includes(id)).map(e=>byId[e[0]===id?e[1]:e[0]].label),type=n.type==='self'?'centre of the map':n.type==='category'?'category':n.type==='trait'?'part of me':n.type==='good'?'helpful outcome':'painful outcome',detail=document.getElementById('nodeDetail');detail.innerHTML=`<div class="nodeType">${type}</div><h2>${esc(n.label)}</h2><p class="nodeConnections"><b>Connected to:</b> ${connected.length?connected.map(esc).join(' · '):'Nothing yet'}</p>${n.type==='trait'?`<button class="toggleButton" id="editBranch">Edit this branch</button><button class="secondary" id="removeBranch">Remove this branch</button>`:''}`;if(n.type==='trait'){document.getElementById('editBranch').onclick=()=>renderMapAdd(n.category,n.record);document.getElementById('removeBranch').onclick=()=>{if(confirm('Remove this part and its helpful and painful outcome leaves?')){state.selfMap=state.selfMap.filter(x=>x.id!==n.record.id);save();renderGraph()}}}};svg.querySelectorAll('[data-graph-node]').forEach(g=>{g.onclick=e=>{e.stopPropagation();if(suppressGraphClick)return;selectGraphNode(byId[g.dataset.graphNode],show)};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectGraphNode(byId[g.dataset.graphNode],show)}}});bindGraphGestures(svg);document.getElementById('graphHome').onclick=()=>{selectedGraphId='me';graphCamera={cx:400,cy:300,w:800,h:500};applyGraphCamera();show('me')};document.getElementById('graphIn').onclick=()=>zoomSelectedNode(data,1.3);document.getElementById('graphOut').onclick=()=>zoomSelectedNode(data,.77);applyGraphCamera()}
function renderMapAdd(selected=mapCategories[0],editing=null){document.querySelector('.route').textContent='Grow my self-map';document.getElementById('progress').innerHTML='';const options=mapCategories.map(c=>`<option ${c===(editing?.category||selected)?'selected':''}>${c}</option>`).join(''),st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">${editing?'Edit':'Add'} a branch</div><h1>What part of you are you noticing?</h1><div class="mapForm"><label>Category</label><select id="mapCategory">${options}</select><label>The part of me</label><textarea class="field" id="mapTrait" placeholder="For example: I notice small changes in people">${esc(editing?.trait||'')}</textarea><label>Good that comes from it</label><textarea class="field" id="mapGood" placeholder="What does this give you or help you do?">${esc(editing?.good||'')}</textarea><label>Bad that comes from it</label><textarea class="field" id="mapBad" placeholder="What can this cost you or make harder?">${esc(editing?.bad||'')}</textarea></div><div class="actions"><button class="primary" id="saveTrait">${editing?'Save this branch':'Grow this branch'}</button><div class="secondary"><button id="cancelTrait">Cancel</button></div></div>`;document.getElementById('saveTrait').onclick=()=>{const trait=document.getElementById('mapTrait').value.trim(),good=document.getElementById('mapGood').value.trim(),bad=document.getElementById('mapBad').value.trim(),category=document.getElementById('mapCategory').value;if(!trait){toast('Name the part first');return}if(!good&&!bad){toast('Add at least one thing that comes from it');return}const record={id:editing?.id||Date.now(),category,trait,good,bad,created:editing?.created||new Date().toISOString()};if(editing){const i=state.selfMap.findIndex(x=>x.id===editing.id);state.selfMap[i]=record}else state.selfMap.push(record);save();renderGraph();toast(editing?'Branch updated':'Added to your map')};document.getElementById('cancelTrait').onclick=renderGraph}
function render(){clearInterval(window.pauseTimer);state.page='clarity';save();document.querySelector('.close').style.visibility='visible';document.querySelector('.route').textContent='Help me understand';progress();const st=document.getElementById('stage');if(state.step>=steps.length)return renderSummary();const s=steps[state.step],a=state.answers[state.step];let body='';
 if(s.type==='text')body=`<textarea class="field" id="answer" placeholder="${s.placeholder}">${esc(a||'')}</textarea>`;
 if(s.type==='triplet')body=`<div class="triplet">${s.fields.map(([k,l,p])=>`<div class="mini"><label>${l}</label><textarea class="field" data-field="${k}" placeholder="${p}">${esc((a||{})[k]||'')}</textarea></div>`).join('')}</div>`;
 if(s.type==='multi'||s.type==='single')body=`<div class="chips">${s.chips.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div>`;
 if(s.type==='multiGrouped')body=s.groups.map(([label,items])=>`<div class="groupLabel">${label}</div><div class="chips">${items.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div>`).join('');
 st.className='stage';st.innerHTML=`<div class="step">Step ${state.step+1} of ${steps.length}</div><h1>${s.title}</h1><p class="explain">${s.help}</p>${body}<div class="actions"><button class="primary" id="next">${state.step===steps.length-1?'Show me the whole picture':'Continue'}</button><div class="secondary"><button id="back">${state.step?'Back':'Close'}</button><button id="unknown">I don’t know</button><button id="skip">Skip this</button></div></div>`;bind(s)}
function capture(s){if(s.type==='text')state.answers[state.step]=document.getElementById('answer').value.trim();if(s.type==='triplet'){const o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value.trim());state.answers[state.step]=o}}
function bind(s){document.getElementById('next').onclick=()=>{capture(s);state.step++;save();render()};document.getElementById('back').onclick=()=>{capture(s);if(state.step){state.step--;save();render()}else toast('This would return to I’m spiralling')};document.getElementById('skip').onclick=()=>{state.answers[state.step]='Skipped';state.step++;save();render()};document.getElementById('unknown').onclick=()=>{state.answers[state.step]='I don’t know';state.step++;save();render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let a=Array.isArray(state.answers[state.step])?state.answers[state.step]:[];if(s.type==='single')a=[b.dataset.choice];else a=a.includes(b.dataset.choice)?a.filter(x=>x!==b.dataset.choice):[...a,b.dataset.choice];state.answers[state.step]=a;save();render()})}
const labels=['What happened','What it seemed to mean','Known · unknown · predicted','Inside me','What I might need','What I want to do next'];
function answerText(i){const a=state.answers[i];if(!a||(Array.isArray(a)&&!a.length))return 'Not answered';if(Array.isArray(a))return a.join(' · ');if(typeof a==='object')return `Known: ${a.known||'—'} / Unknown: ${a.unknown||'—'} / Predicted: ${a.predicted||'—'}`;return a}
function renderSummary(){const st=document.getElementById('stage'),canPause=Array.isArray(state.answers[5])&&state.answers[5].includes('Wait before I do anything');st.className='stage summary';st.innerHTML=`<div class="step">Your assembled picture</div><h1>This can hold more than one truth.</h1>${labels.map((l,i)=>`<div class="row"><button data-edit="${i}">edit</button><b>${l}</b><span>${esc(answerText(i))}</span></div>`).join('')}<div class="choiceList">${canPause?'<button class="primary" id="continueChoice">Set up the pause</button>':''}<button class="binch" id="askBinch">Ask Binch with this context<span class="notbuilt">Copies reviewed context; Telegram opening is not wired yet</span></button><button class="choice" id="restart">Start again</button></div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.edit;save();render()});document.getElementById('restart').onclick=()=>{state.step=0;state.answers={};save();render()};document.getElementById('askBinch').onclick=openBinch;if(canPause)document.getElementById('continueChoice').onclick=()=>renderPause()}
function renderPause(){clearInterval(window.pauseTimer);const p=state.pause.step,s=pauseSteps[p],a=state.pause.answers[p]||[];document.querySelector('.route').textContent='Pause before acting';document.getElementById('progress').innerHTML=pauseSteps.map((_,i)=>`<i class="dot ${i<=p?'on':''}"></i>`).join('');const timerChoices=p===2&&a.includes('After a short timer')?`<div class="groupLabel">How long?</div><div class="chips">${[10,20,30,60].map(n=>`<button class="chip ${state.pause.duration===n?'selected':''}" data-duration="${n}">${n} minutes</button>`).join('')}</div>`:'';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Pause · Step ${p+1} of 3</div><h1>${s.title}</h1><p class="explain">${s.help}</p><div class="chips">${s.chips.map(c=>`<button class="chip ${a.includes(c)?'selected':''}" data-pchoice="${c}">${c}</button>`).join('')}</div>${timerChoices}<div class="actions"><button class="primary" id="pauseNext">${p===2?'Review the pause':'Continue'}</button><div class="secondary"><button id="pauseBack">Back</button><button id="pauseSkip">Skip this</button></div></div>`;document.querySelectorAll('[data-pchoice]').forEach(b=>b.onclick=()=>{const chosen=b.dataset.pchoice;let v=state.pause.answers[p]||[];v=s.type==='single'?[chosen]:v.includes(chosen)?v.filter(x=>x!==chosen):[...v,chosen];state.pause.answers[p]=v;save();if(p===1&&chosen==='Write what I want to do without doing it'&&v.includes(chosen))renderDraftBox();else renderPause()});document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{state.pause.duration=+b.dataset.duration;save();renderPause()});document.getElementById('pauseNext').onclick=()=>{if(p<2){state.pause.step++;save();renderPause()}else renderPauseReview()};document.getElementById('pauseBack').onclick=()=>{if(p){state.pause.step--;save();renderPause()}else renderSummary()};document.getElementById('pauseSkip').onclick=()=>{state.pause.answers[p]=['Skipped'];if(p<2){state.pause.step++;save();renderPause()}else renderPauseReview()}}
function renderDraftBox(){document.querySelector('.close').style.visibility='visible';document.querySelector('.route').textContent='Draft box';document.getElementById('progress').innerHTML='';const held=pauseText(0),st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Write it here instead of doing it</div><h1>What wants to come out?</h1><p class="explain">Write the message, argument, decision, post, or action exactly as it exists in your head. This is not sent anywhere.</p><div class="holdCard"><b>Currently putting on hold</b><span>${esc(held)}</span></div><textarea class="field" id="draftText" placeholder="Put the whole unedited draft here…">${esc(state.pause.draft.text||'')}</textarea><p class="quietNote">The box hides the draft from view after you lock it. It is a deliberate pause, not cryptographic encryption or a physical block.</p><div class="actions"><button class="primary" id="lockDraft">Lock this draft away</button><div class="secondary"><button id="draftBack">Back without locking</button></div></div>`;document.getElementById('lockDraft').onclick=()=>{const text=document.getElementById('draftText').value.trim();if(!text){toast('Write the draft first');return}state.pause.draft={text,locked:true,lockedAt:Date.now()};save();renderLockedDraft()};document.getElementById('draftBack').onclick=()=>{state.pause.draft.text=document.getElementById('draftText').value;save();renderImpulseHold()}}
function renderLockedDraft(){document.querySelector('.close').style.visibility='visible';document.querySelector('.route').textContent='Draft box';document.getElementById('progress').innerHTML='';const d=state.pause.draft,st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Stored only on this device</div><h1>The draft is in the box.</h1><p class="explain">Nothing was sent. You do not have to complete another process unless it would genuinely help.</p><div class="lockBox"><div class="lockSeal">🔒</div><div class="lockedPreview">Draft sealed from view</div><div class="draftMeta">${d.lockedAt?new Date(d.lockedAt).toLocaleString():''}</div></div><div class="actions"><button class="primary" id="keepDraftLocked">Keep it locked and return home</button><button class="supportPath" id="optionalPause">Optional pause setup<small>Add a return time only if you want one.</small></button><div class="secondary"><button id="openDraft">Open and review</button><button id="deleteDraft">Delete draft</button></div></div>`;document.getElementById('keepDraftLocked').onclick=renderHome;document.getElementById('optionalPause').onclick=()=>{state.pause.step=2;save();renderPause()};document.getElementById('openDraft').onclick=()=>{state.pause.draft.locked=false;save();renderDraftBox()};document.getElementById('deleteDraft').onclick=()=>{if(confirm('Delete this locked draft from this device?')){state.pause.draft={text:'',locked:false,lockedAt:null};save();renderSpiralPaths()}}}
function pauseText(i){const a=state.pause.answers[i];return a&&a.length?a.join(' · '):'Nothing selected'}
function renderPauseReview(){clearInterval(window.pauseTimer);document.querySelector('.route').textContent='Pause before acting';document.getElementById('progress').innerHTML='<i class="dot on"></i><i class="dot on"></i><i class="dot on"></i>';const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Your pause</div><h1>You can leave this untouched for now.</h1><div class="holdCard"><b>Putting on hold</b><span>${esc(pauseText(0))}</span></div><div class="holdCard"><b>What may help</b><span>${esc(pauseText(1))}</span></div><div class="holdCard"><b>When I’ll return</b><span>${esc(pauseText(2))}${state.pause.answers[2]?.includes('After a short timer')?` · ${state.pause.duration} minutes`:''}</span></div><p class="quietNote">This does not lock anything. You can return, change it, or end it whenever you choose.</p><div class="actions"><button class="primary" id="beginPause">Begin the pause</button><div class="secondary"><button id="editPause">Change choices</button><button id="backSummary">Back to summary</button></div></div>`;document.getElementById('beginPause').onclick=()=>{state.pause.active=true;state.pause.started=Date.now();save();renderActivePause()};document.getElementById('editPause').onclick=()=>{state.pause.step=0;save();renderPause()};document.getElementById('backSummary').onclick=renderSummary}
function renderActivePause(){document.querySelector('.route').textContent='Pause in progress';document.getElementById('progress').innerHTML='';const timed=state.pause.answers[2]?.includes('After a short timer'),st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">For now</div><h1>The decision can wait.</h1><div class="holdCard"><b>Currently on hold</b><span>${esc(pauseText(0))}</span></div>${timed?'<div class="timerReadout" id="timerReadout"></div><p class="quietNote" id="timerNote">Keep Understory open if you want to watch the timer.</p>':'<p class="quietNote">There is no deadline. Return when you choose—not when the app demands an answer.</p>'}<div class="actions"><button class="primary" id="keepPause">Keep pausing</button><div class="secondary"><button id="reviewPause">Review choices</button><button id="endPause">End pause</button></div></div>`;const update=()=>{if(!timed)return;const end=state.pause.started+state.pause.duration*60000,left=Math.max(0,end-Date.now()),mins=Math.floor(left/60000),secs=Math.floor((left%60000)/1000),out=document.getElementById('timerReadout');if(out)out.textContent=left?`${mins}:${String(secs).padStart(2,'0')}`:'Timer finished';if(!left){clearInterval(window.pauseTimer);document.getElementById('timerNote').textContent='The timer ended. You can still keep waiting if you are not ready.'}};update();window.pauseTimer=setInterval(update,1000);document.getElementById('keepPause').onclick=()=>{if(timed&&Date.now()>=state.pause.started+state.pause.duration*60000){state.pause.started=Date.now();save();renderActivePause()}else toast('The pause is still yours')};document.getElementById('reviewPause').onclick=()=>{state.pause.active=false;save();renderPauseReview()};document.getElementById('endPause').onclick=()=>{state.pause.active=false;state.pause.started=null;state.pause.step=0;save();renderSummary()}}
let returnFromSettings=renderHome;
function renderSettings(){clearInterval(window.pauseTimer);document.querySelector('.route').textContent='Settings';document.querySelector('.close').style.visibility='visible';document.getElementById('progress').innerHTML='';const installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const st=document.getElementById('stage');st.className='stage';st.innerHTML=`<div class="step">Understory</div><h1>Settings</h1><div class="settingBlock"><h2>Privacy and storage</h2><p>Your entries, journal pieces, pause state, and settings stay in this browser. Nothing is sent to a server.</p><p>Clearing Safari website data or removing the app’s site data will remove everything saved here.</p><button class="toggleButton" id="clearData">Clear all local data</button></div><div class="settingBlock"><h2>Install on iPhone</h2><div class="statusLine">${installed?'Opened as Home Screen app':'Browser version'}</div><p>${installed?'Understory is running in standalone app mode.':'In Safari, tap Share, then Add to Home Screen. Open it from the leaf icon.'}</p></div><div class="settingBlock"><h2>Offline use</h2><p>The core support screens are cached on this device after the first successful load.</p></div><div class="actions"><button class="primary" id="settingsBack">Back</button></div>`;document.getElementById('settingsBack').onclick=returnFromSettings;document.getElementById('clearData').onclick=()=>{if(confirm('Clear all Understory entries, journal pieces, and saved choices from this device?')){localStorage.removeItem(KEY);location.reload()}}}
function openBinch(){const shared=state.spiral.context?`What is happening: ${state.spiral.context}\n\n`:'';document.getElementById('contextText').value=`I’m using Understory and want help.\n\n${shared}${labels.map((l,i)=>`${l}: ${answerText(i)}`).join('\n')}\n\nPlease help me separate what I know from what I’m predicting, without assuming my concerns are imaginary.`;document.getElementById('modal').classList.add('open')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('copyContext').onclick=async()=>{const t=document.getElementById('contextText');try{await navigator.clipboard.writeText(t.value);toast('Copied to clipboard')}catch{t.select();document.execCommand('copy');toast('Copied to clipboard')}};document.querySelector('.close').onclick=renderHome;document.getElementById('settingsButton').onclick=()=>{const page=state.page;returnFromSettings=()=>page==='journal'?renderJournal():page==='spiral'?renderSpiralHub():page==='clarity'?render():page==='carry'?renderCarry():state.pause.active?renderActivePause():renderHome();renderSettings()};if('serviceWorker' in navigator)window.addEventListener('load',()=>{let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register('./service-worker.js').catch(()=>{})});state.pause.active?renderActivePause():renderHome();
</script></body></html>
