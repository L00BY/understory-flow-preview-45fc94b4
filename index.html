<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet"><title>Understory — Understand what happened</title><style>
*{box-sizing:border-box}body{margin:0;background:#a9a08e;color:#293a31;font-family:Handlee,cursive}.phone{width:min(430px,100vw);height:min(760px,100vh);min-height:650px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#f8f2e9b8,#f8f2e9b8),url('assets/background.png') center/cover;box-shadow:0 15px 45px #49423866}.top{position:absolute;top:23px;left:27px;right:27px;display:flex;justify-content:space-between;align-items:center}.route{font:700 9px system-ui;text-transform:uppercase;letter-spacing:.16em;color:#53665b}.close{border:0;background:none;color:#354b40;font:25px Handlee;cursor:pointer}.progress{position:absolute;top:61px;left:31px;right:31px;height:3px;display:flex;gap:5px}.dot{height:2px;flex:1;background:#82918855}.dot.on{background:#466252}.stage{position:absolute;top:92px;left:52px;right:52px;bottom:80px;display:flex;flex-direction:column}.step{font:700 9px system-ui;text-transform:uppercase;letter-spacing:.17em;color:#617168;margin-bottom:10px}.stage h1{font-size:27px;line-height:1.14;margin:0 0 10px;color:#29473a}.explain{font-size:14px;line-height:1.4;color:#52645b;margin:0 0 18px}.field{width:100%;min-height:120px;border:0;border-bottom:1px solid #536b5e;background:#f3eee4b8;padding:13px 12px;color:#293a31;font:16px/1.35 Handlee,cursive;resize:none;outline:none;box-shadow:0 4px 12px #554c4020}.field:focus{background:#f8f3e9dd;border-color:#294c3b}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 8px}.chip{border:1px solid #60756788;background:#edf0e9b8;padding:7px 10px;color:#344b40;font:13px Handlee;cursor:pointer;border-radius:0;transform:rotate(-.4deg)}.chip:nth-child(even){transform:rotate(.5deg)}.chip.selected{background:#496454;color:#f7f1e7;border-color:#496454}.triplet{display:grid;gap:12px}.mini label{display:block;font:700 9px system-ui;text-transform:uppercase;letter-spacing:.14em;color:#5b6c62;margin-bottom:4px}.mini textarea{min-height:59px}.actions{margin-top:auto}.primary{width:100%;border:0;border-bottom:1px solid #496254;background:#e3e9e1c9;padding:11px 13px;color:#29473a;text-align:left;font:17px Handlee;cursor:pointer;position:relative}.primary:after{content:'→';position:absolute;right:12px}.secondary{display:flex;justify-content:space-between;margin-top:13px}.secondary button{border:0;background:none;color:#53675d;padding:3px;font:13px Handlee;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.summary{overflow:auto;padding-bottom:12px}.summary h1{margin-bottom:14px}.row{border-bottom:1px solid #64776b70;padding:8px 2px}.row b{display:block;font:700 9px system-ui;text-transform:uppercase;letter-spacing:.13em;color:#66756d;margin-bottom:3px}.row span{font-size:14px;line-height:1.3}.row button{float:right;border:0;background:none;color:#52685d;font:11px Handlee;text-decoration:underline;cursor:pointer}.choiceList{display:grid;gap:8px;margin-top:6px}.choice{border:0;border-bottom:1px solid #61766a88;background:#eff1ebb8;text-align:left;padding:9px 11px;color:#30483c;font:14px Handlee;cursor:pointer}.choice.selected{background:#496454;color:#f7f1e7}.binch{margin-top:13px;border:1px solid #60756899;background:#f4eee4c9;padding:9px 11px;font:14px Handlee;color:#30483c;cursor:pointer;width:100%}.notbuilt{display:block;font:9px system-ui;color:#6a756f;margin-top:4px}.modal{position:absolute;inset:0;background:#283d35aa;display:none;align-items:center;justify-content:center;padding:32px;z-index:4}.modal.open{display:flex}.paper{width:100%;background:#f5efe4;padding:20px;box-shadow:4px 8px 24px #1f2e28aa}.paper h2{margin:0 0 7px;font-size:23px}.paper p{font-size:12px;color:#54645b}.paper textarea{width:100%;height:180px;border:1px solid #71827866;background:#fffaf2;padding:10px;font:13px/1.35 Handlee;color:#293a31}.paper .buttons{display:flex;gap:8px;margin-top:10px}.paper button{flex:1;border:0;background:#496454;color:#fff8ed;padding:9px;font:13px Handlee;cursor:pointer}.paper button.alt{background:#dce4dc;color:#30483c}.toast{position:absolute;bottom:22px;left:65px;right:65px;background:#355144;color:#fff8ed;text-align:center;padding:9px;font:12px system-ui;display:none;z-index:6}.toast.show{display:block}
</style></head><body><main class="phone"><header class="top"><div class="route">Help me understand</div><button class="close" aria-label="Close">×</button></header><div class="progress" id="progress"></div><section class="stage" id="stage"></section><div class="modal" id="modal"><div class="paper"><h2>Context for Binch</h2><p>Review this first. Nothing is sent automatically.</p><textarea id="contextText"></textarea><div class="buttons"><button id="copyContext">Copy text</button><button class="alt" id="closeModal">Close</button></div><span class="notbuilt">Opening Telegram is not wired in this review prototype.</span></div></div><div class="toast" id="toast">Copied to clipboard</div></main><script>
const KEY='understory-understand-flow-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{"step":0,"answers":{}}');
const steps=[
 {title:'What happened?',help:'Describe only what someone could have seen or heard. You do not need to explain why yet.',type:'text',placeholder:'For example: They replied “okay” and then stopped responding.',chips:['Their tone changed','Plans changed','They stopped replying','Something was said']},
 {title:'What did your mind say it meant?',help:'This is the meaning, fear, or prediction that arrived—not a confession that it is wrong.',type:'text',placeholder:'For example: They are annoyed with me and are pulling away.',chips:['They’re angry with me','I’ve ruined it','They don’t want me','I’m too much']},
 {title:'What do you actually know?',help:'Separate what is confirmed from what is still unknown or being predicted.',type:'triplet',fields:[['known','Known','What is directly confirmed?'],['unknown','Unknown','What information do you not have?'],['predicted','Predicted','What is your mind expecting will happen?']]},
 {title:'What is happening inside you?',help:'Choose anything that fits. Feelings, body states, and urges can all be here together.',type:'multi',chips:['Panicked','Angry','Ashamed','Hurt','Numb','Chest tight','Want to message','Want to disappear','Want reassurance']},
 {title:'What might you need?',help:'A need is not a demand or proof that anyone is wrong. Choose what would help you feel clearer or safer.',type:'multi',chips:['Reassurance','Closeness','Clear information','Space','Repair','To be heard','Rest','Protection']},
 {title:'What would help now?',help:'Choose a next move. This can be changed later; it is not a verdict on the situation.',type:'single',chips:['Pause before acting','Ask directly','Draft without sending','Carry me through it','One small action','Return to this later']}
];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progress(){document.getElementById('progress').innerHTML=steps.map((_,i)=>`<i class="dot ${i<=state.step?'on':''}"></i>`).join('')}
function render(){progress();const st=document.getElementById('stage');if(state.step>=steps.length)return renderSummary();const s=steps[state.step],a=state.answers[state.step];let body='';
 if(s.type==='text')body=`<textarea class="field" id="answer" placeholder="${s.placeholder}">${esc(a||'')}</textarea><div class="chips">${s.chips.map(c=>`<button class="chip" data-add="${c}">${c}</button>`).join('')}</div>`;
 if(s.type==='triplet')body=`<div class="triplet">${s.fields.map(([k,l,p])=>`<div class="mini"><label>${l}</label><textarea class="field" data-field="${k}" placeholder="${p}">${esc((a||{})[k]||'')}</textarea></div>`).join('')}</div>`;
 if(s.type==='multi'||s.type==='single')body=`<div class="chips">${s.chips.map(c=>`<button class="chip ${(Array.isArray(a)?a:[]).includes(c)?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div>`;
 st.className='stage';st.innerHTML=`<div class="step">Step ${state.step+1} of ${steps.length}</div><h1>${s.title}</h1><p class="explain">${s.help}</p>${body}<div class="actions"><button class="primary" id="next">${state.step===steps.length-1?'Show me the whole picture':'Continue'}</button><div class="secondary"><button id="back">${state.step?'Back':'Close'}</button><button id="unknown">I don’t know</button><button id="skip">Skip this</button></div></div>`;bind(s)}
function capture(s){if(s.type==='text')state.answers[state.step]=document.getElementById('answer').value.trim();if(s.type==='triplet'){const o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value.trim());state.answers[state.step]=o}}
function bind(s){document.getElementById('next').onclick=()=>{capture(s);state.step++;save();render()};document.getElementById('back').onclick=()=>{capture(s);if(state.step){state.step--;save();render()}else toast('This would return to I’m spiralling')};document.getElementById('skip').onclick=()=>{state.answers[state.step]='Skipped';state.step++;save();render()};document.getElementById('unknown').onclick=()=>{state.answers[state.step]='I don’t know';state.step++;save();render()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=document.getElementById('answer');t.value=t.value?`${t.value} ${b.dataset.add}.`:`${b.dataset.add}.`;t.focus()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let a=Array.isArray(state.answers[state.step])?state.answers[state.step]:[];if(s.type==='single')a=[b.dataset.choice];else a=a.includes(b.dataset.choice)?a.filter(x=>x!==b.dataset.choice):[...a,b.dataset.choice];state.answers[state.step]=a;save();render()})}
const labels=['What happened','What it seemed to mean','Known · unknown · predicted','Inside me','What I might need','Possible next move'];
function answerText(i){const a=state.answers[i];if(!a||(Array.isArray(a)&&!a.length))return 'Not answered';if(Array.isArray(a))return a.join(' · ');if(typeof a==='object')return `Known: ${a.known||'—'} / Unknown: ${a.unknown||'—'} / Predicted: ${a.predicted||'—'}`;return a}
function renderSummary(){const st=document.getElementById('stage');st.className='stage summary';st.innerHTML=`<div class="step">Your assembled picture</div><h1>This can hold more than one truth.</h1>${labels.map((l,i)=>`<div class="row"><button data-edit="${i}">edit</button><b>${l}</b><span>${esc(answerText(i))}</span></div>`).join('')}<div class="choiceList"><button class="binch" id="askBinch">Ask Binch with this context<span class="notbuilt">Copies reviewed context; Telegram opening is not wired yet</span></button><button class="choice" id="restart">Start again</button></div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.edit;save();render()});document.getElementById('restart').onclick=()=>{state.step=0;state.answers={};save();render()};document.getElementById('askBinch').onclick=openBinch}
function openBinch(){document.getElementById('contextText').value=`I’m using Understory and want help understanding what happened.\n\n${labels.map((l,i)=>`${l}: ${answerText(i)}`).join('\n')}\n\nPlease help me separate what I know from what I’m predicting, without assuming my concerns are imaginary.`;document.getElementById('modal').classList.add('open')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('copyContext').onclick=async()=>{const t=document.getElementById('contextText');try{await navigator.clipboard.writeText(t.value);toast('Copied to clipboard')}catch{t.select();document.execCommand('copy');toast('Copied to clipboard')}};document.querySelector('.close').onclick=()=>toast('This would return to I’m spiralling');render();
</script></body></html>
